<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedShop - You're Offline</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --secondary: #10b981;
      --dark: #111827;
      --light: #f9fafb;
      --gray: #6b7280;
      --font-sans: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: var(--font-sans);
      background-color: var(--light);
      color: var(--dark);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    
    .offline-container {
      max-width: 500px;
      width: 100%;
      padding: 40px 20px;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }
    
    .offline-icon {
      font-size: 72px;
      color: var(--primary);
      margin-bottom: 24px;
    }
    
    h1 {
      font-size: 2rem;
      margin-bottom: 16px;
      color: var(--dark);
    }
    
    p {
      color: var(--gray);
      margin-bottom: 24px;
    }
    
    .btn {
      display: inline-block;
      background-color: var(--primary);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 500;
      text-decoration: none;
      transition: background-color 0.3s;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
    }
    
    .btn:hover {
      background-color: var(--primary-dark);
    }
    
    .secondary-btn {
      background-color: transparent;
      color: var(--primary);
      margin-top: 16px;
      border: 1px solid var(--primary);
    }
    
    .secondary-btn:hover {
      background-color: rgba(37, 99, 235, 0.1);
    }
    
    .offline-info {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid rgba(0, 0, 0, 0.1);
    }
    
    .offline-info h3 {
      margin-bottom: 16px;
      font-size: 1.2rem;
      color: var(--dark);
    }
    
    .offline-features {
      list-style: none;
      text-align: left;
      margin: 0 auto;
      max-width: 300px;
    }
    
    .offline-features li {
      margin-bottom: 8px;
      display: flex;
      align-items: center;
    }
    
    .offline-features li::before {
      content: "✓";
      color: var(--secondary);
      font-weight: bold;
      margin-right: 10px;
    }
    
    .logo {
      max-width: 150px;
      margin-bottom: 32px;
    }
    
    /* Dark mode support */
    @media (prefers-color-scheme: dark) {
      :root {
        --light: #1e293b;
        --dark: #f8fafc;
      }
      
      body {
        background-color: #0f172a;
      }
      
      .offline-container {
        background-color: #1e293b;
      }
      
      .secondary-btn {
        border-color: var(--primary);
      }
      
      .offline-info {
        border-top-color: rgba(255, 255, 255, 0.1);
      }
    }
    
    /* Landscape mode support */
    @media (orientation: landscape) and (max-height: 500px) {
      .offline-container {
        padding: 20px;
      }
      
      .offline-icon {
        font-size: 48px;
        margin-bottom: 16px;
      }
      
      h1 {
        font-size: 1.5rem;
        margin-bottom: 8px;
      }
      
      .logo {
        max-width: 100px;
        margin-bottom: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <img src="/images/logo.png" alt="MedShop Logo" class="logo">
    
    <div class="offline-icon">
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 12C2 7.28595 2 4.92893 3.46447 3.46447C4.92893 2 7.28595 2 12 2C16.714 2 19.0711 2 20.5355 3.46447C22 4.92893 22 7.28595 22 12C22 16.714 22 19.0711 20.5355 20.5355C19.0711 22 16.714 22 12 22C7.28595 22 4.92893 22 3.46447 20.5355C2 19.0711 2 16.714 2 12Z" stroke="currentColor" stroke-width="1.5" />
        <path d="M8.5 10.5C9.60457 10.5 10.5 9.60457 10.5 8.5C10.5 7.39543 9.60457 6.5 8.5 6.5C7.39543 6.5 6.5 7.39543 6.5 8.5C6.5 9.60457 7.39543 10.5 8.5 10.5Z" stroke="currentColor" stroke-width="1.5" />
        <path d="M15.5 17.5C16.6046 17.5 17.5 16.6046 17.5 15.5C17.5 14.3954 16.6046 13.5 15.5 13.5C14.3954 13.5 13.5 14.3954 13.5 15.5C13.5 16.6046 14.3954 17.5 15.5 17.5Z" stroke="currentColor" stroke-width="1.5" />
        <path d="M8.5 17.5H9.5M15.5 6.5H14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        <path d="M17.5 6.5L6.5 17.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>
    </div>
    
    <h1>You're offline</h1>
    <p>The page you're trying to access is not available offline. Please check your internet connection and try again.</p>
    
    <button onclick="window.location.reload()" class="btn">Retry</button>
    <br>
    <button onclick="window.history.back()" class="btn secondary-btn">Go Back</button>
    
    <div class="offline-info">
      <h3>Available Offline</h3>
      <ul class="offline-features">
        <li>Products you've viewed recently</li>
        <li>Your shopping cart</li>
        <li>Your saved items</li>
        <li>Search for cached products</li>
      </ul>
    </div>
  </div>
  
  <script>
    // Check for online status changes
    window.addEventListener('online', () => {
      window.location.reload();
    });
    
    // Check if we have locally cached data
    document.addEventListener('DOMContentLoaded', () => {
      if ('caches' in window) {
        caches.open('medshop-cache-v1').then(cache => {
          cache.match('/api/products').then(response => {
            if (response) {
              const offlineInfo = document.querySelector('.offline-info');
              const browseCachedBtn = document.createElement('button');
              browseCachedBtn.className = 'btn secondary-btn';
              browseCachedBtn.textContent = 'Browse Cached Products';
              browseCachedBtn.onclick = () => {
                window.location.href = '/products';
              };
              offlineInfo.insertBefore(browseCachedBtn, offlineInfo.querySelector('h3'));
            }
          });
        });
      }
    });
  </script>
</body>
</html>
